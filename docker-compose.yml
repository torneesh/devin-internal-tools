# Local identity provider for the SSO demo: `make sso` then `make run-sso`.
# Keycloak speaks the same OpenID Connect protocol as Entra ID / Okta.
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: ${KC_HOSTNAME:-http://localhost:8080}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    ports:
      - "8080:8080"
    volumes:
      - ./sso/realm.json:/opt/keycloak/data/import/realm.json:ro

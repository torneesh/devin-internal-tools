<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="htmx-config" content='{"responseHandling":[{"code":"...","swap":true}]}'>
  <title>{% block title %}Internal Tools{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <style>
    :root { --pico-font-size: 95%; }
    nav select { margin: 0; padding-top: .3rem; padding-bottom: .3rem; min-width: 18rem; }
    .flash { padding: .75rem 1rem; margin-bottom: 1rem; }
    .flash-success { border-left: 4px solid #2e7d32; }
    .flash-error { border-left: 4px solid #c62828; }
    .error { color: #c62828; }
    .status { padding: .1rem .5rem; border-radius: .3rem; font-size: .8rem; font-weight: 600; }
    .status-requested, .status-open, .status-pending { background: #e3f2fd; }
    .status-approved, .status-submitted { background: #fff3e0; }
    .status-succeeded, .status-done { background: #e8f5e9; }
    .status-failed, .status-rejected { background: #ffebee; }
    .status-unknown, .status-escalated { background: #fde68a; }
    .masked details { display: inline-block; margin: 0 0 0 .5rem; vertical-align: middle; }
    .masked details summary { padding: .1rem .6rem; font-size: .8rem; }
    .masked form { margin-top: .5rem; min-width: 22rem; }
    .actions { display: flex; flex-wrap: wrap; gap: 1rem; align-items: flex-start; }
    .action-form { display: flex; gap: .5rem; margin: 0; }
    .action-form input, .action-form select, .action-form button { margin: 0; width: auto; }
    dl.detail { display: grid; grid-template-columns: max-content 1fr; gap: .4rem 1.5rem; }
    dl.detail dt { font-weight: 600; }
    dl.detail dd { margin: 0; }
    table.audit td { font-size: .85rem; vertical-align: top; }
  </style>
</head>
<body>
<header class="container">
  <nav>
    <ul>
      <li><a href="/"><strong>Internal Tools</strong></a></li>
      {% for t in nav_tools %}<li><a href="{{ t.path }}">{{ t.name }}</a></li>{% endfor %}
      {% if user and user.has_role('auditor') %}<li><a href="/audit">Audit log</a></li>{% endif %}
    </ul>
    {% if user %}
    <ul>
      <li>
        <form method="post" action="/login" style="margin:0">
          <input type="hidden" name="next" value="{{ request.url.path }}">
          <select name="username" onchange="this.form.submit()" aria-label="Signed in as" title="Mock SSO: switch user">
            {% for u in all_users %}
            <option value="{{ u.username }}" {% if u.username == user.username %}selected{% endif %}>
              {{ u.username }} · {{ 'all roles' if u.roles|length > 3 else u.roles|sort|join(', ') }}
            </option>
            {% endfor %}
          </select>
        </form>
      </li>
    </ul>
    {% endif %}
  </nav>
</header>
<main class="container">
  {% for f in flashes %}<article class="flash flash-{{ f.kind }}">{{ f.message }}</article>{% endfor %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
